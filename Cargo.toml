[package]
name = "qwen3-asr-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async streams
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio processing
hound = "3.5"
rubato = "0.15"
tempfile = "3"

# qwen3-asr with CUDA support for Jetson Orin
qwen3-asr = { version = "0.2", default-features = false, features = ["cuda"] }

cudarc = { version = "0.19.3", features = ["cuda-12060"] }

[dev-dependencies]
httpc-test = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
"candle-kernels" = { path = "../candle/candle-kernels" }
